[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "jpholiday"
description = "Japanese public holidays, powered by a zero-dependency Rust engine (PyO3)"
authors = [
    { name = "Vatis", email = "vatis@lalcs.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
]
dynamic = ["version"]
keywords = ["japan", "holiday", "japanese", "calendar", "public-holiday", "祝日"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Rust",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Other/Nonlisted Topic",
    "Natural Language :: Japanese",
    "Natural Language :: English",
    "Typing :: Typed",
]

[project.urls]
"Homepage" = "https://github.com/Lalcs/jpholiday"
"Bug Tracker" = "https://github.com/Lalcs/jpholiday/issues"
"Repository" = "https://github.com/Lalcs/jpholiday"

[tool.maturin]
# Python ソースはリポジトリ直下の `jpholiday/` パッケージ。
python-source = "."
# 生成する拡張モジュールを `jpholiday._rust` として配置する。
module-name = "jpholiday._rust"
# バインディング crate の場所。バージョンはこの crate の `version` を採用する。
manifest-path = "rust/Cargo.toml"
