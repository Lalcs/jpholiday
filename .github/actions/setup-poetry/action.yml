name: Set up Python and Poetry
description: Python と Poetry をセットアップし、キャッシュを利用して依存関係をインストールする

inputs:
  python-version:
    description: 使用する Python のバージョン
    required: true
  install-args:
    description: poetry install に渡す追加引数 (例 "--only lint")
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Set up Python ${{ inputs.python-version }}
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      uses: snok/install-poetry@v1
      with:
        virtualenvs-create: true
        virtualenvs-in-project: true

    # パッチバージョンが上がると venv が壊れるため、実際のバージョンをキーに含める
    - name: Load cached venv
      id: cached-poetry-dependencies
      uses: actions/cache@v4
      with:
        path: .venv
        key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ inputs.install-args }}-${{ hashFiles('**/poetry.lock') }}

    - name: Install dependencies
      if: steps.cached-poetry-dependencies.outputs.cache-hit != 'true'
      shell: bash
      run: poetry install --no-interaction --no-root ${{ inputs.install-args }}

    - name: Install project
      shell: bash
      run: poetry install --no-interaction ${{ inputs.install-args }}
